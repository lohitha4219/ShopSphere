<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sphereGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A" />
      <stop offset="0.45" stop-color="#2563EB" />
      <stop offset="1" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="8" y1="20" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="0.5" stop-color="#FBBF24" />
      <stop offset="1" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="20" y1="20" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Spherical Base Globe -->
  <circle cx="32" cy="32" r="28" fill="url(#sphereGrad)" />

  <!-- Subtle 3D Spherical Coordinate Latitudes -->
  <ellipse cx="32" cy="32" rx="16" ry="28" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Dynamic Cosmic Shopping Orbit Ring -->
  <ellipse cx="32" cy="32" rx="30" ry="11" transform="rotate(-26 32 32)" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="140 25" />

  <!-- Orbiting Satellite Node -->
  <circle cx="56" cy="20" r="3.5" fill="#FBBF24" filter="url(#glow)" />

  <!-- Shopping Bag Handle -->
  <path d="M25 24C25 20.134 28.134 17 32 17C35.866 17 39 20.134 39 24" stroke="url(#bagGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Shopping Bag Body -->
  <path d="M20 24.5H44L41.2 46C41.05 47.1 40.15 48 39 48H25C23.85 48 22.95 47.1 22.8 46L20 24.5Z" fill="url(#bagGrad)" />

  <!-- Bag Fold Detail / Dimension -->
  <path d="M20 24.5L25 30H39L44 24.5" fill="#CBD5E1" opacity="0.6" />

  <!-- Center Sparkle Star -->
  <path d="M32 32L33.4 36.2L37.5 37.5L33.4 38.8L32 43L30.6 38.8L26.5 37.5L30.6 36.2L32 32Z" fill="#2563EB" />
</svg>